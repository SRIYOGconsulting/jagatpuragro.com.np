
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Toggle Test</title>
</head>
<body>

    <h1 data-i18n="hero.title">Welcome to Jagatpur Agro</h1>

    <p data-i18n="hero.description">
        We provide quality Boer goat breeding services.
    </p>

    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="ne">नेपाली</button>

    <script>
        const translations = {
            en: {
                "hero.title": "Welcome to Jagatpur Agro",
                "hero.description":
                    "We provide quality Boer goat breeding services."
            },
            ne: {
                "hero.title": "जगतपुर एग्रोमा स्वागत छ",
                "hero.description":
                    "हामी गुणस्तरीय बोयर बाख्रा प्रजनन सेवा प्रदान गर्छौँ।"
            }
        };

        document.querySelectorAll("[data-lang]").forEach(button => {
            button.addEventListener("click", () => {
                const language = button.dataset.lang;

                document.documentElement.lang = language;

                document.querySelectorAll("[data-i18n]").forEach(element => {
                    const key = element.dataset.i18n;
                    const text = translations[language][key];

                    if (text !== undefined) {
                        element.textContent = text;
                    }
                });
            });
        });
    </script>

</body>
</html>
